<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Issue 1</title>
</head>
<body>
  <h1>Issue 1</h1>
  <p id="status">Checking sign-in...</p>
  <p id="links">
    <a href="/.auth/login/aad">Sign in with Microsoft</a> |
    <a href="/.auth/login/github">Sign in with GitHub</a>
  </p>
  <p id="logout" hidden><a href="/.auth/logout">Sign out</a></p>
  <script>
    fetch('/.auth/me')
      .then(r => r.json())
      .then(({ clientPrincipal: u }) => {
        const status = document.getElementById('status');
        if (u) {
          status.textContent = 'Signed in as ' + u.userDetails + ' (' + u.identityProvider + ')';
          document.getElementById('links').hidden = true;
          document.getElementById('logout').hidden = false;
        } else {
          status.textContent = 'Not signed in';
        }
      })
      .catch(() => { document.getElementById('status').textContent = 'Auth unavailable'; });
  </script>
</body>
</html>
